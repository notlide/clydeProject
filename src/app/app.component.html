<div class="row">
  <div class="col-12 text-center">
    <button type="button" class="btn" [ngClass]="currentState === 'Roles' ? 'btn-success' : 'btn-primary' " (click)="onChange('Roles')"> Roles</button>
    <button type="button" class="btn" [ngClass]="currentState === 'Desitination' ? 'btn-success' : 'btn-primary' " (click)="onChange('Desitination')"> Desitination</button>
  </div>
</div>
<div class="row">
  <div class="col-12" *ngIf="currentState === 'Roles'">
    <app-roles></app-roles>
  </div>
  <div class="col-12" *ngIf="currentState === 'Desitination'">
    <app-destination></app-destination>
  </div>
</div>
